# Bench test on a Waveshare ESP32-C6 (Zero / mini, 4MB flash).
#
# No MQTT: open http://alpicool-test.local (or the IP from the logs) to see every
# value and use every control, and watch the logs over USB:
#   esphome run alpicool-fridge-test.yaml
#
# Close the fridge's phone app first; the fridge accepts only one connection.

substitutions:
  fridge_mac: "XX:XX:XX:XX:XX:XX"

esphome:
  name: alpicool-test
  # Windows only: ESP-IDF can't build in a path with spaces. Remove on Linux/HA.
  build_path: C:/esp/alpicool-test

esp32:
  variant: esp32c6
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  # VERBOSE shows every BLE frame sent and received; switch to DEBUG once it works.
  level: VERBOSE
  logs:
    # Keep the radio stack's own chatter down.
    esp32_ble_tracker: DEBUG
    esp32_ble_client: DEBUG
    web_server: INFO
    # VERBOSE wifi logs print the Wi-Fi password.
    wifi: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${fridge_mac}
    id: fridge_ble

alpicool_fridge:
  - id: fridge
    ble_client_id: fridge_ble
    update_interval: 15s
    bind_on_connect: false

binary_sensor:
  - platform: alpicool_fridge
    online:
      name: "Online"
    dual_zone:
      name: "Dual zone"

sensor:
  - platform: alpicool_fridge
    left_current_temperature:
      name: "Left temperature"
    right_current_temperature:
      name: "Right temperature"
    left_target_temperature:
      name: "Left target"
    right_target_temperature:
      name: "Right target"
    battery_percent:
      name: "Battery"
    battery_voltage:
      name: "Voltage"
    running_status:
      name: "Running status (raw)"

climate:
  - platform: alpicool_fridge
    zone: left
    name: "Left zone"
  - platform: alpicool_fridge
    zone: right
    name: "Right zone"

switch:
  - platform: alpicool_fridge
    power:
      name: "Power"
    lock:
      name: "Button lock"

select:
  - platform: alpicool_fridge
    run_mode:
      name: "Mode"
    battery_saver:
      name: "Battery protection"

number:
  - platform: alpicool_fridge
    left_target_temperature:
      name: "Left setpoint"
    right_target_temperature:
      name: "Right setpoint"
    left_hysteresis:
      name: "Left hysteresis"
    right_hysteresis:
      name: "Right hysteresis"
    start_delay:
      name: "Start delay"
